services:
  web:
    build:
      context: .
      target: development
      args:
        NODE_VERSION: "24.18.0"
    init: true
    user: "10001:10001"
    working_dir: /app/source
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      PATH: /app/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      VITE_CACHE_DIR: /app/.vite-cache
      VITE_OUT_DIR: /tmp/lincoln-island-dist
    volumes:
      - .:/app/source:ro
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/app/source/scripts/dev-server-smoke.mjs",
          "http://127.0.0.1:5173"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
